# Load the distribution defaults before applying the curated source policy.
Include = /etc/paru.conf

[options]
# Reset any inherited mode to official repositories, then add curated
# PKGBUILD repositories. The AUR remains excluded.
RepoOnly
Mode = pkgbuilds
# Keep Paru unable to fetch AUR metadata or PKGBUILDs. The aur-search command
# queries the read-only AUR RPC endpoint independently.
AurUrl = https://aur-install-disabled.invalid/
AurRpcUrl = https://aur-install-disabled.invalid/rpc
RemoveMake
CleanAfter

[curated-arch]
Url = https://github.com/geri1701/curated-arch-packages.git
# The repository layout is packages/<pkgbase>/PKGBUILD.
Depth = 3
